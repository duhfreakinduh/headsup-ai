name: Driver Guard Tests

on:
  push:
    branches: ["main", "fix/driver-guard-v4-tested"]
    paths:
      - "driver-guard/**"
      - ".github/workflows/driver-guard-v4-test.yml"
  pull_request:
    paths:
      - "driver-guard/**"
      - ".github/workflows/driver-guard-v4-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Patch v5 lazy loading
        if: github.ref_name == 'fix/driver-guard-v4-tested'
        run: python driver-guard/ci-patch-v5.py
      - name: Syntax checks
        run: |
          node --check driver-guard/app.js
          node --check driver-guard/detection-core.js
          node --check driver-guard/sw.js
      - name: Detection engine tests
        run: node --test driver-guard/detection-core.test.mjs
      - name: External AI dependency probes
        shell: bash
        run: |
          node <<'NODE'
          const checks = [
            ['MediaPipe ESM','https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/+esm',1000],
            ['MediaPipe WASM','https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm/vision_wasm_internal.wasm',100000],
            ['HF face model','https://huggingface.co/abiral1011/skin_detect/resolve/main/face_landmarker.task',3000000],
            ['HF YOLOS config','https://huggingface.co/Xenova/yolos-tiny/resolve/main/config.json',100],
            ['Transformers.js','https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1',1000],
          ];
          for (const [name,url,minBytes] of checks) {
            const r = await fetch(url,{redirect:'follow'});
            if (!r.ok) throw new Error(`${name} returned ${r.status}`);
            const buf = await r.arrayBuffer();
            console.log(`${name}: ${r.status}, ${buf.byteLength} bytes`);
            if (buf.byteLength < minBytes) throw new Error(`${name} response too small: ${buf.byteLength}`);
          }
          NODE
      - name: Verify v5 no external static imports
        run: |
          grep -q "detection-core.js?v=5" driver-guard/app.js
          grep -q "await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/+esm')" driver-guard/app.js
          grep -q "await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1')" driver-guard/app.js
          ! grep -q "^import { pipeline" driver-guard/app.js
          ! grep -q "^import { FaceLandmarker" driver-guard/app.js
          grep -q "driver-guard-v5" driver-guard/sw.js
      - name: Install browser test dependency
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Browser startup smoke test
        run: |
          python3 -m http.server 4173 --directory . >/tmp/driver-guard-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME_PATH=/usr/bin/google-chrome node driver-guard/browser-smoke.mjs
      - name: Commit tested v5 patch
        if: github.ref_name == 'fix/driver-guard-v4-tested'
        run: |
          if git diff --quiet -- driver-guard/app.js driver-guard/index.html driver-guard/sw.js; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add driver-guard/app.js driver-guard/index.html driver-guard/sw.js
          git commit -m "Fix Driver Guard v5 startup [skip ci]"
          git push origin HEAD:fix/driver-guard-v4-tested
