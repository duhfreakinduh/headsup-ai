name: Driver Guard Android

on:
  pull_request:
    paths:
      - "driver-guard-android/**"
      - ".github/workflows/driver-guard-android.yml"
  push:
    branches: ["feature/driver-guard-android-v1"]
    paths:
      - "driver-guard-android/**"
      - ".github/workflows/driver-guard-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download AI models from Hugging Face
        run: |
          chmod +x driver-guard-android/scripts/fetch_hf_models.sh
          driver-guard-android/scripts/fetch_hf_models.sh

      - name: Verify Hugging Face model assets
        run: |
          test $(wc -c < driver-guard-android/app/src/main/assets/face_landmarker.task) -gt 3000000
          test $(wc -c < driver-guard-android/app/src/main/assets/yolos_tiny_quantized.onnx) -gt 9000000

      - name: Unit tests and APK build
        run: gradle -p driver-guard-android testDebugUnitTest assembleDebug --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-guard-android-v1-debug
          path: driver-guard-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
